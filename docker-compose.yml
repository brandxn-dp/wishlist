services:
  wishlist:
    image: ghcr.io/brandxn-dp/wishlist:latest
    container_name: wishlist
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      # How often (hours) to re-check prices in the background. 0 disables.
      - PRICE_CHECK_HOURS=24
      # The image includes Chromium for tricky stores. Set to "off" to save memory.
      # - BROWSER=off
